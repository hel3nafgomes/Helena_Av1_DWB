<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista de Personagens</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>
<body> 

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">
        Rick and Morty API
      </span>
    </div>
  </nav>

  <div class="container py-5">

    <h1 class="text-center mb-5">
      Lista de Personagens
    </h1>

    <div id="loading" class="text-center mb-4">
      <div class="spinner-border text-success"></div>
    </div>

    <div id="erro"></div>

    <div class="mb-4">
      <input
        type="text"
        class="form-control"
        id="search"
        placeholder="Buscar personagem..."
      >
    </div>

    <div class="row" id="cards"></div>

    <nav class="mt-5">
      <ul class="pagination justify-content-center">
        <li class="page-item" id="prev-btn">
          <button class="page-link">Anterior</button>
        </li>
        <li class="page-item" id="page-info"><span class="page-link">Página 1</span></li>
        <li class="page-item" id="next-btn">
          <button class="page-link">Próxima</button>
        </li>
      </ul>
    </nav>

  </div>

  <script src="js/script.js"></script>

</body>
</html>
